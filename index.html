<!doctype html>
<html lang="fr" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navigation.css" />
  </head>

  <body>
    <main>
      <!-- Module Accueil -->
      <section id="accueil" class="ecran actif">
        <p id="date-du-jour" class="sous-titre"></p>
        <h1 class="salutation">
          <span id="salutation">Bonjour</span>
          <i data-lucide="plant-pot"></i>
        </h1>

        <!-- Carte Aujourd'hui -->
        <article class="carte">
          <h2>Aujourd'hui</h2>
          <div id="liste-taches"></div>
          <form id="form-tache">
            <input
              id="champ-tache"
              type="texte"
              placeholder="Ajouter une tâche..."
            />
          </form>
        </article>

        <!-- Carte menus -->
        <article class="carte">
          <h2>Au menu</h2>
          <div id="liste-menu"></div>
        </article>

        <!-- carte budget -->
        <article class="carte">
          <h2>Budget du mois</h2>
          <p id="jours-restants" class="sous-titre"></p>
          <p class="sous-titre">Il te reste</p>
          <p id="montant-reste" class="montant"></p>
        </article>
      </section>

      <!-- Module Agenda -->
      <section id="agenda" class="ecran">
        <h1>Agenda</h1>
      </section>

      <!-- Module Foyer -->
      <section id="foyer" class="ecran">
        <h1>Foyer</h1>
      </section>

      <!-- Module Moi -->
      <section id="moi" class="ecran">
        <h1>Moi</h1>
      </section>
    </main>

    <nav class="barre-nav">
      <button class="onglet actif" data-ecran="accueil">
        <i data-lucide="house"></i>
        <span>Accueil</span>
      </button>
      <button class="onglet" data-ecran="agenda">
        <i data-lucide="calendar-days"></i>
        <span>Agenda</span>
      </button>
      <button class="bouton-plus">
        <i data-lucide="plus"></i>
      </button>
      <button class="onglet" data-ecran="foyer">
        <i data-lucide="sofa"></i>
        <span>Foyer</span>
      </button>
      <button class="onglet" data-ecran="moi">
        <i data-lucide="flower"></i>
        <span>Moi</span>
      </button>
    </nav>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/donnees/stockage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
